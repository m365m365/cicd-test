name: Java CI

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean package


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::839920003786:role/GitHubActions-CicdTest-Role
          aws-region: ap-northeast-1


      - name: Create deployment package
        run: |
          cp target/cicd-test-0.0.1-SNAPSHOT.jar cicd-test-0.0.1-SNAPSHOT.jar
          zip deploy.zip cicd-test-0.0.1-SNAPSHOT.jar Procfile
          

      - name: Upload deployment package to S3
        run: |
          aws s3 cp deploy.zip s3://elasticbeanstalk-ap-northeast-1-839920003786/cicd-test/deploy.zip